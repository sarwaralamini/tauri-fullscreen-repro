<!doctype html>
<html lang="en" data-theme="light" data-theme-preference="solarized-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .app-shell {
      display: grid;
      grid-template-rows: 50px 66px minmax(0, 1fr);
      height: 100%;
      background: #f8f3e6;
    }

    .app-header {
      background: #196482;
      color: white;
    }
  </style>
  <title>Pulse layout test</title>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <header class="app-header">Top edge of the WebView</header>
      <div class="app-toolbar">Toolbar</div>
      <main>Enter and exit fullscreen using the green window button.</main>
    </div>
  </div>
</body>
</html>
